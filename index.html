<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie Borealis</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      padding:30px;
    }

    h1{
      text-align:center;
      margin-bottom:40px;
      font-size:42px;
    }

    h2{
      margin-top:60px;
      margin-bottom:25px;
      border-bottom:2px solid #444;
      padding-bottom:10px;
    }

    .gallery{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:center;
    }

    .card{
      background:#222;
      padding:15px;
      border-radius:15px;
      width:280px;
      box-shadow:0 0 10px rgba(0,0,0,0.5);
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    .card h3{
      text-align:center;
      margin-top:15px;
    }
  </style>
</head>

<body>

<h1>Galerie Borealis ⚙️</h1>

<!-- ========================= -->
<!-- SECTION BOREALIS -->
<!-- ========================= -->

<h2>Borealis</h2>

<div class="gallery">

  <div class="card">
    <img src="bandeau-borealis.jpg">
    <h3>Bandeau Borealis</h3>
  </div>

  <div class="card">
    <img src="commissaire.jpg">
    <h3>Commissaire</h3>
  </div>

  <div class="card">
    <img src="executeur.jpg">
    <h3>Executeur</h3>
  </div>

  <div class="card">
    <img src="pyrojecteur.jpg">
    <h3>Pyrojecteur</h3>
  </div>

  <div class="card">
    <img src="transmetteur.jpg">
    <h3>Transmetteur</h3>
  </div>

  <div class="card">
    <img src="voltigeur.jpg">
    <h3>Voltigeur</h3>
  </div>

</div>

<!-- ========================= -->
<!-- SECTION ARMÉE -->
<!-- ========================= -->

  </div>

  <div class="card">
    <img src="fusillier.jpg">
    <h3>Fusillier</h3>
  </div>

  <div class="card">
    <img src="grenadier.png">
    <h3>Grenadier</h3>
  </div>

  <div class="card">
    <img src="lance-flamme.jpg">
    <h3>Lance-flamme</h3>
  </div>

  <div class="card">
    <img src="medecin.png">
    <h3>Médecin</h3>
  </div>

  <div class="card">
    <img src="sergent.jpg">

  </div>

  <div class="card">
    <img src="sniper.png">
    <h3>Sniper</h3>
  </div>

  <div class="card">
    <img src="combattant.png">
    <h3>Combattant</h3>
  </div>

  <div class="card">
    <img src="lieutenant.png">
    <h3>Lieutenant</h3>
  </div>

  <div class="card">
    <img src="mitrailleur-lourd.png">
    <h3>Mitrailleur lourd</h3>
  </div>

  <div class="card">
    <img src="pretre.png">

  <div class="card">

  </div>

</div>

</body>
</html>
