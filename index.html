<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie Borealis</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      padding:30px;
    }

    h1{
      text-align:center;
      margin-bottom:40px;
      font-size:42px;
    }

    h2{
      margin-top:60px;
      margin-bottom:25px;
      border-bottom:2px solid #444;
      padding-bottom:10px;
    }

    .gallery{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:center;
    }

    .card{
      background:#222;
      padding:15px;
      border-radius:15px;
      width:280px;
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    .card h3{
      text-align:center;
    }
  </style>
</head>

<body>

<h1>Galerie Borealis ⚙️</h1>

<h2>Borealis</h2>

<div class="gallery">

  <div class="card">
    <img src="Bandeau borealis.jpg">
    <h3>Bandeau Borealis</h3>
  </div>

  <div class="card">
    <img src="Commissaire.jpg">
    <h3>Commissaire</h3>
  </div>

  <div class="card">
    <img src="Executeur.jpg">
    <h3>Executeur</h3>
  </div>

  <div class="card">
    <img src="Pyrojecteur.jpg">
    <h3>Pyrojecteur</h3>
  </div>

  <div class="card">
    <img src="Transmetteur.jpg">
    <h3>Transmetteur</h3>
  </div>

  <div class="card">
    <img src="Voltigeur.jpg">
    <h3>Voltigeur</h3>
  </div>

</div>

<h2>Armée Impériale</h2>

<div class="gallery">

  <div class="card">
    <img src="Bandeau faction Britan.png">
    <h3>Bandeau Armée</h3>
  </div>

  <div class="card">
    <img src="Fusillier.jpg">
    <h3>Fusillier</h3>
  </div>

  <div class="card">
    <img src="grenadier.png">
    <h3>Grenadier</h3>
  </div>

  <div class="card">
    <img src="Lance flamme.jpg">
    <h3>Lance-flamme</h3>
  </div>

  <div class="card">
    <img src="medecin.png">
    <h3>Médecin</h3>
  </div>

  <div class="card">
    <img src="Sergent.jpg">
    <h3>Sergent</h3>
  </div>

  <div class="card">
    <img src="sniper.png">
    <h3>Sniper</h3>
  </div>

  <div class="card">
    <img src="Combattant.png">
    <h3>Combattant</h3>
  </div>

  <div class="card">
    <img src="Lieutenant.png">
    <h3>Lieutenant</h3>
  </div>

  <div class="card">
    <img src="Mitrailleur.jpg">
    <h3>Mitrailleur lourd</h3>
  </div>

</div>

</body>
</html>
